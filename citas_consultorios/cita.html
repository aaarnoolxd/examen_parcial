<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita Medica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 mb-2 text-primary">Solicitud de cita</h1>
                        <p class="text-secondary mb-4">Completa el formulario para reservar tu consulta.</p>

                        <form id="formulario-cita" novalidate>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingresa tu nombre" minlength="3" maxlength="60" required>
                                <div id="error-nombre" class="form-text text-danger"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                                <div id="error-email" class="form-text text-danger"></div>
                            </div>

                            <div class="mb-3">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input type="date" id="fecha" name="fecha" class="form-control" required>
                                <div id="error-fecha" class="form-text text-danger"></div>
                            </div>

                            <div class="mb-3">
                                <label for="especialidad" class="form-label">Especialidad</label>
                                <select id="especialidad" name="especialidad" class="form-select" required>
                                    <option value="">Selecciona una especialidad</option>
                                    <option value="General">General</option>
                                    <option value="Odontologia">Odontologia</option>
                                    <option value="Nutricion">Nutricion</option>
                                </select>
                                <div id="error-especialidad" class="form-text text-danger"></div>
                            </div>

                            <div class="mb-3">
                                <label for="horario" class="form-label">Horario</label>
                                <select id="horario" name="horario" class="form-select" required>
                                    <option value="">Selecciona un horario</option>
                                </select>
                                <div id="error-horario" class="form-text text-danger"></div>
                                <div id="mensaje-horarios" class="form-text"></div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Continuar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
