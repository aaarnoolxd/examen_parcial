<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigal de Lima | Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4">
                            <h1 class="h3 mb-2 text-primary">Trigal de Lima</h1>
                            <p class="text-secondary mb-0">Consulta tu pedido y calcula el presupuesto.</p>
                        </div>

                        <form id="formulario-pedido" novalidate>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="cliente" class="form-label">Nombre</label>
                                    <input type="text" id="cliente" name="cliente" class="form-control" minlength="3" maxlength="60" placeholder="Nombre del cliente" required>
                                    <div id="error-cliente" class="form-text text-danger"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="email" id="correo" name="correo" class="form-control" placeholder="correo@ejemplo.com" required>
                                    <div id="error-correo" class="form-text text-danger"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="fecha" class="form-label">Fecha de entrega</label>
                                    <input type="date" id="fecha" name="fecha" class="form-control" required>
                                    <div id="error-fecha" class="form-text text-danger"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="modalidad" class="form-label">Modalidad</label>
                                    <select id="modalidad" name="modalidad" class="form-select" required>
                                        <option value="">Selecciona una modalidad</option>
                                        <option value="retiro">Retiro</option>
                                        <option value="reparto">Reparto</option>
                                    </select>
                                    <div id="error-modalidad" class="form-text text-danger"></div>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h2 class="h5 mb-0">Productos</h2>
                                <span class="text-secondary small">Elige uno o mas productos</span>
                            </div>

                            <div class="table-responsive">
                                <table class="table align-middle">
                                    <thead>
                                        <tr>
                                            <th>Elegir</th>
                                            <th>Producto</th>
                                            <th>Precio</th>
                                            <th>Cantidad</th>
                                        </tr>
                                    </thead>
                                    <tbody id="lista-productos"></tbody>
                                </table>
                            </div>

                            <div id="error-productos" class="text-danger mb-3"></div>

                            <div class="row g-3 mt-2">
                                <div class="col-12 col-lg-6">
                                    <div class="border rounded-3 p-3 bg-white">
                                        <h2 class="h5 mb-3">Resumen</h2>
                                        <div class="d-flex justify-content-between"><span>Subtotal</span><strong id="subtotal">S/ 0.00</strong></div>
                                        <div class="d-flex justify-content-between"><span>Descuento</span><strong id="descuento">S/ 0.00</strong></div>
                                        <div class="d-flex justify-content-between"><span>Reparto</span><strong id="reparto">S/ 0.00</strong></div>
                                        <hr>
                                        <div class="d-flex justify-content-between fs-5"><span>Total</span><strong id="total">S/ 0.00</strong></div>
                                    </div>
                                </div>

                                <div class="col-12 col-lg-6 d-flex align-items-end">
                                    <div class="w-100 d-grid gap-2">
                                        <button type="submit" class="btn btn-primary btn-lg">Calcular pedido</button>
                                        <small class="text-secondary">Se aplican S/ 8.00 de reparto y 10% de descuento si el subtotal llega a S/ 100.00.</small>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
